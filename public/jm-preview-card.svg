<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Gradiente de fundo azul-marinho nobre da identidade visual João Moreira -->
    <linearGradient id="bgNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081426" />
      <stop offset="50%" stop-color="#0B1E3B" />
      <stop offset="100%" stop-color="#050C17" />
    </linearGradient>

    <!-- Gradiente dourado clássico para o monograma e detalhes -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF9E" />
      <stop offset="25%" stop-color="#D4AF37" />
      <stop offset="60%" stop-color="#AA821C" />
      <stop offset="100%" stop-color="#805F0F" />
    </linearGradient>

    <!-- Gradiente dourado suave para bordas e sutilezas -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#AA821C" stop-opacity="0" />
      <stop offset="20%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#F5DF9E" stop-opacity="1" />
      <stop offset="80%" stop-color="#D4AF37" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#AA821C" stop-opacity="0" />
    </linearGradient>

    <radialGradient id="goldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#D4AF37" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#0B1E3B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fundo principal -->
  <rect width="1200" height="630" fill="url(#bgNavy)" />

  <!-- Brilho radial suave ao redor do emblema central -->
  <circle cx="600" cy="225" r="280" fill="url(#goldGlow)" />

  <!-- Moldura geométrica elegante (estilo selo / pericial / alta autoridade) -->
  <rect x="36" y="36" width="1128" height="558" rx="16" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.45" />
  <rect x="46" y="46" width="1108" height="538" rx="12" fill="none" stroke="#D4AF37" stroke-width="0.75" stroke-opacity="0.25" />

  <!-- Cantos decorativos clássicos -->
  <path d="M56 80 L56 56 L80 56" fill="none" stroke="url(#gold)" stroke-width="2.5" />
  <path d="M1144 80 L1144 56 L1120 56" fill="none" stroke="url(#gold)" stroke-width="2.5" />
  <path d="M56 550 L56 574 L80 574" fill="none" stroke="url(#gold)" stroke-width="2.5" />
  <path d="M1144 550 L1144 574 L1120 574" fill="none" stroke="url(#gold)" stroke-width="2.5" />

  <!-- Emblema Central: Leão Heráldico estilizado em vetor dourado -->
  <g transform="translate(600, 140)">
    <!-- Coroa / Cabeça do Leão estilizada com crina -->
    <!-- Crina externa -->
    <path d="M0 -62 C16 -62 32 -54 42 -40 C52 -26 56 -8 54 10 C52 24 44 38 34 48 C24 38 20 28 18 16 C12 26 2 34 0 35 C-2 34 -12 26 -18 16 C-20 28 -24 38 -34 48 C-44 38 -52 24 -54 10 C-56 -8 -52 -26 -42 -40 C-32 -54 -16 -62 0 -62 Z" fill="url(#gold)" opacity="0.95" />
    
    <!-- Detalhes internos da face / majestade do leão -->
    <path d="M0 -48 C8 -48 18 -42 22 -32 C26 -20 24 -8 20 2 C16 -4 10 -10 0 -12 C-10 -10 -16 -4 -20 2 C-24 -8 -26 -20 -22 -32 C-18 -42 -8 -48 0 -48 Z" fill="#081426" />
    
    <!-- Olhos e fronte -->
    <polygon points="-12,-22 -6,-24 -8,-18" fill="url(#gold)" />
    <polygon points="12,-22 6,-24 8,-18" fill="url(#gold)" />
    <polygon points="0,-14 -5,-4 5,-4" fill="url(#gold)" />
    <!-- Focinho e queixo heráldico -->
    <path d="M-6,2 L0,9 L6,2 Z" fill="url(#gold)" />
    <path d="M-2,10 L2,10 L0,16 Z" fill="url(#gold)" />

    <!-- Coroa heráldica superior acima do leão -->
    <path d="M-26 -66 L-20 -78 L-8 -70 L0 -84 L8 -70 L20 -78 L26 -66 Z" fill="url(#gold)" />
  </g>

  <!-- Monograma JM em tipografia de alta autoridade serifada -->
  <!-- Letras JM entrelaçadas em dourado -->
  <g transform="translate(600, 260)">
    <text x="0" y="40" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="110" font-weight="800" letter-spacing="4" fill="url(#gold)" text-anchor="middle">JM</text>
  </g>

  <!-- Linha divisória fina com detalhe em losango central -->
  <g transform="translate(600, 350)">
    <line x1="-360" y1="0" x2="-24" y2="0" stroke="url(#goldBorder)" stroke-width="1.5" />
    <polygon points="0,-7 7,0 0,7 -7,0" fill="url(#gold)" />
    <circle cx="-16" cy="0" r="2" fill="url(#gold)" opacity="0.8" />
    <circle cx="16" cy="0" r="2" fill="url(#gold)" opacity="0.8" />
    <line x1="24" y1="0" x2="360" y2="0" stroke="url(#goldBorder)" stroke-width="1.5" />
  </g>

  <!-- Tipografia: Nome do Profissional -->
  <text x="600" y="420" font-family="'Playfair Display', Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" letter-spacing="2" fill="#FFFFFF" text-anchor="middle">
    JOÃO MOREIRA
  </text>

  <!-- Tipografia: Título Pericial & Consultivo -->
  <text x="600" y="475" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="600" letter-spacing="5" fill="#D4AF37" text-anchor="middle">
    PERITO JUDICIAL TJMG • CONSULTOR &amp; ASSISTENTE TÉCNICO
  </text>

  <!-- Tagline institucional -->
  <text x="600" y="525" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="400" letter-spacing="1" fill="#C2D1E5" text-anchor="middle">
    Perícia Judicial • Assistência Técnica • Cálculos Complexos • Tecnologia &amp; IA
  </text>

  <!-- Domínio no rodapé inferior -->
  <text x="600" y="565" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" letter-spacing="3" fill="#8EA3BF" text-anchor="middle">
    JOAOMOREIRAPERITO.COM.BR
  </text>
</svg>
